<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Rafay Abbas Shah: I build AI agents and automation that run in production." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070D22"/>
      <stop offset="1" stop-color="#101A3A"/>
    </linearGradient>
    <linearGradient id="aur1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EE6C8" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#5EE6C8" stop-opacity="0.9"/>
      <stop offset="0.7" stop-color="#9B7BFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FF6FB5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="aur2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9B7BFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FF6FB5" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#5EE6C8" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <style>
      .name { font: 700 64px "Avenir Next", "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #F2F4FF; letter-spacing: -1px; }
      .line { font: 400 24px "Avenir Next", "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #C9D0F0; }
      .meta { font: 500 17px "Avenir Next", "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #7F8BB8; }
      @media (prefers-reduced-motion: reduce) { animate, animateTransform { display: none; } }
    </style>
  </defs>

  <rect width="1200" height="340" rx="16" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#E8ECFF">
    <circle cx="610" cy="38" r="1.2" opacity=".7"/><circle cx="688" cy="92" r="0.9" opacity=".5"/>
    <circle cx="742" cy="30" r="1.4" opacity=".8"/><circle cx="820" cy="64" r="1" opacity=".6"/>
    <circle cx="905" cy="22" r="1.1" opacity=".7"/><circle cx="968" cy="88" r="0.8" opacity=".5"/>
    <circle cx="1040" cy="44" r="1.3" opacity=".8"/><circle cx="1112" cy="76" r="1" opacity=".6"/>
    <circle cx="1160" cy="30" r="0.9" opacity=".5"/><circle cx="560" cy="110" r="0.8" opacity=".4"/>
    <circle cx="1080" cy="140" r="1" opacity=".5"><animate attributeName="opacity" values=".5;.1;.5" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="130" r="1.2" opacity=".6"><animate attributeName="opacity" values=".6;.15;.6" dur="5.5s" repeatCount="indefinite"/></circle>
    <circle cx="70" cy="300" r="0.9" opacity=".4"/><circle cx="420" cy="30" r="1" opacity=".5"/>
  </g>

  <!-- aurora: the one moving thing -->
  <g>
    <path fill="none" stroke="url(#aur1)" stroke-width="46" filter="url(#glow)" opacity=".75"
          d="M420,210 C600,120 760,250 920,150 S1150,90 1260,140">
      <animate attributeName="d" dur="14s" repeatCount="indefinite"
        values="M420,210 C600,120 760,250 920,150 S1150,90 1260,140;
                M420,190 C600,160 760,200 920,130 S1150,130 1260,110;
                M420,210 C600,120 760,250 920,150 S1150,90 1260,140"/>
    </path>
    <path fill="none" stroke="url(#aur1)" stroke-width="2.5" filter="url(#soft)" opacity=".9"
          d="M420,210 C600,120 760,250 920,150 S1150,90 1260,140">
      <animate attributeName="d" dur="14s" repeatCount="indefinite"
        values="M420,210 C600,120 760,250 920,150 S1150,90 1260,140;
                M420,190 C600,160 760,200 920,130 S1150,130 1260,110;
                M420,210 C600,120 760,250 920,150 S1150,90 1260,140"/>
    </path>
    <path fill="none" stroke="url(#aur2)" stroke-width="30" filter="url(#glow)" opacity=".55"
          d="M500,270 C680,200 820,300 1000,220 S1180,190 1260,210">
      <animate attributeName="d" dur="18s" repeatCount="indefinite"
        values="M500,270 C680,200 820,300 1000,220 S1180,190 1260,210;
                M500,250 C680,240 820,250 1000,200 S1180,230 1260,190;
                M500,270 C680,200 820,300 1000,220 S1180,190 1260,210"/>
    </path>
  </g>

  <!-- horizon -->
  <path d="M0,318 Q600,300 1200,318 L1200,340 L0,340 Z" fill="#050A1A" opacity=".8"/>

  <text x="64" y="150" class="name">Rafay Abbas Shah</text>
  <text x="66" y="198" class="line">I build AI agents and automation that run in production.</text>
  <text x="66" y="256" class="meta">Founder of Flominds AI, Karachi</text>
</svg>
